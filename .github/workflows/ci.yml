name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so that a new stable release (and its new lints) cannot turn the
  # build red on its own; bump deliberately.
  RUST_VERSION: '1.98.1'

jobs:
  desktop-core:
    name: desktop · core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal --component rustfmt --component clippy
          rustup default $RUST_VERSION

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-core-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-${{ env.RUST_VERSION }}-

      - name: Formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

      # The GUI needs a windowing system, so on Linux only the security and
      # network core is built — that is the part the tests cover.
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Tests
        working-directory: desktop
        run: cargo test --no-default-features

  desktop-windows:
    name: desktop · Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-gui-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gui-${{ env.RUST_VERSION }}-

      - name: Tests
        working-directory: desktop
        run: cargo test --no-default-features

      - name: Build syncmob-desktop.exe
        working-directory: desktop
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: syncmob-desktop-windows
          path: desktop/target/release/syncmob-desktop.exe
          if-no-files-found: error

  mobile:
    name: mobile · APK + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: mobile
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug APK
        working-directory: mobile
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Release APK (unsigned)
        working-directory: mobile
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: syncmob-apk-debug
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-report
          path: mobile/app/build/reports/tests/
          if-no-files-found: ignore
