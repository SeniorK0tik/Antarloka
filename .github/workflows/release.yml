name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.98.1'

jobs:
  windows:
    name: syncmob-desktop.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Build
        working-directory: desktop
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: desktop/target/release/syncmob-desktop.exe
          if-no-files-found: error

  android:
    name: SyncMob.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: mobile
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # The release APK is only signed when a keystore is configured in the
      # repository secrets; otherwise the installable build is the debug one.
      - name: Is a keystore configured?
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — publishing the debug-signed APK."
          fi

      - name: Sign release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out mobile/app/build/outputs/apk/release/SyncMob-release.apk \
            mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify mobile/app/build/outputs/apk/release/SyncMob-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile/app/build/outputs/apk/debug/app-debug.apk dist/SyncMob-debug.apk
          if [ -f mobile/app/build/outputs/apk/release/SyncMob-release.apk ]; then
            cp mobile/app/build/outputs/apk/release/SyncMob-release.apk dist/SyncMob.apk
          else
            cp mobile/app/build/outputs/apk/release/app-release-unsigned.apk dist/SyncMob-unsigned.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SyncMob $TAG" \
            --generate-notes
